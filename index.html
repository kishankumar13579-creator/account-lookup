<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Lookup + EMI Schedule</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(120deg,#89f7fe,#66a6ff);
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card {
    width:700px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input, select, button {
    width:95%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    font-size:16px;
}

button {
    border:none;
    background:#4facfe;
    color:white;
    cursor:pointer;
}

.hidden { display:none; }

.result {
    margin-top:10px;
    padding:10px;
    background:#f4f6f8;
    border-radius:10px;
    max-height:320px;
    overflow:auto;
}

table {
    width:98%;
    margin:0 auto;
    border-collapse:collapse;
    table-layout:fixed;
    text-align:center;
}

th, td {
    border:1px solid #ccc;
    padding:4px;
    font-size:12px;
    word-wrap:break-word;
}

th {
    background:#e0e0e0;
}

tr {
    page-break-inside: avoid;
}
</style>
</head>

<body>

<div class="card">

    <!-- Top Right Credit -->
    <div style="width:100%; display:flex; justify-content:flex-end; font-size:12px; color:#ed0a0a;">
        Developed by - Kishan Kumar
    </div>

    <h2>🔍 Write-Off Account Lookup</h2>

    <input type="text" id="accId"
        placeholder="Enter Account ID"
        oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,''); searchData()">

    <div id="status"></div>
    <div id="result" class="result hidden"></div>

    <div id="emiSection" class="hidden">

        <input type="text" id="emiAmount"
            placeholder="Enter EMI Amount"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <select id="emiDate">
            <option value="">Select Installment Date Between 02 to 10</option>
        </select>

        <!-- ✅ BUTTON GROUP -->
        <div style="display:flex; gap:8px;">
            <button onclick="generateSchedule()">Generate</button>
            <button id="downloadBtn" class="hidden" onclick="downloadPDF()">Download</button>
            <button onclick="refreshPage()" style="background:#ff5c5c;">Refresh</button>
        </div>

    </div>

    <div id="schedule" class="result hidden"></div>

</div>

<script>

let dataMap = {};
let currentRecord = null;

// Dropdown
for (let i = 2; i <= 10; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = i;
    document.getElementById("emiDate").appendChild(opt);
}

// Load JSON
window.onload = function () {
    fetch('data.json')
    .then(res => res.json())
    .then(data => {
        data.forEach(row => {
            dataMap[String(row.AccountID).trim()] = row;
        });
    });
};

// Search
function searchData() {

    let id = document.getElementById("accId").value.trim();
    let resultDiv = document.getElementById("result");
    let emiSection = document.getElementById("emiSection");

    if (id.length > 0 && (id.length < 12 || id.length > 14)) {
        resultDiv.innerHTML = "❌ Account ID must be 12–14 characters";
        resultDiv.classList.remove("hidden");
        emiSection.classList.add("hidden");
        return;
    }

    if (!id) {
        resultDiv.classList.add("hidden");
        emiSection.classList.add("hidden");
        return;
    }

    let record = dataMap[id];

    if (record) {
        currentRecord = record;

        resultDiv.innerHTML = `
            	<div style="font-size:13px;">
				
					<div style="margin-bottom:6px;">
						<b>Branch Name :</b> ${record.BranchName || ''}
					</div>
				
					<div style="display:flex; justify-content:space-between; margin-bottom:6px;">
						<span><b>Client ID :</b> ${record.ClientID || ''}</span>
						<span style="margin-right:150px;"><b>Mobile No :</b> ${record.Mobile || ''}</span>
					</div>
				
					<div style="display:flex; justify-content:space-between; margin-bottom:6px;">
						<span><b>Client Name :</b> ${record.ClientName || ''}</span>
						<span style="margin-right:150px;"><b>Spouse Name :</b> ${record.RelationName || ''}</span>
					</div>
				
					<div>
						<b>Written-Off Amount :</b> ${record.WrittenOffAmount || ''}
					</div>
				
				</div>  
                   
        `;
        resultDiv.classList.remove("hidden");
        emiSection.classList.remove("hidden");
    } else {
        resultDiv.innerHTML = "No data found";
        resultDiv.classList.remove("hidden");
        emiSection.classList.add("hidden");
    }
}

// Generate Schedule
function generateSchedule() {

    let emi = parseFloat(document.getElementById("emiAmount").value);
    let emiDate = parseInt(document.getElementById("emiDate").value);

    if (!currentRecord) return;

    let total = Number(currentRecord.WrittenOffAmount) +
                Number(currentRecord.InterestAmount);

    if (!emi || isNaN(emi)) return alert("Enter valid EMI");
    if (emi <= 0) return alert("EMI > 0");
    if (emi > total) return alert("EMI cannot exceed total");
    if (!emiDate) return alert("Select date Between 2 to 10 ");

    let today = new Date();
    let month = 1;

    let html = `
    <div id="pdfContent">

        <h3 style="text-align:center;">WRITE-OFF CLIENT DETAILS</h3>

        		<div style="position:relative;">
		
			<!-- ✅ LOGO FIXED TOP RIGHT -->
			<img src="./ACFL_LOGO.png"
				style="position:absolute; top:0; right:0; height:70px;">
		
			<!-- LEFT CONTENT -->
			<div style="width:75%; font-size:13px;">
		
				<div style="margin-bottom:6px;">
					<b>Branch Name :</b> ${currentRecord.BranchName || ''}
				</div>
		
				<div style="display:flex; justify-content:space-between; margin-bottom:6px;">
					<span><b>Account ID :</b> ${currentRecord.AccountID || ''}</span>
					<span><b>Client ID :</b> ${currentRecord.ClientID || ''}</span>
				</div>
		
				<div style="display:flex; justify-content:space-between; margin-bottom:6px;">
					<span><b>Client Name :</b> ${currentRecord.ClientName || ''}</span>
					<span><b>Spouse Name :</b> ${currentRecord.RelationName || ''}</span>
				</div>
		
				<div style="margin-bottom:6px;">
					<b>Address :</b> ${currentRecord.Address1 || ''}
				</div>
		
				<div>
					<b>Total Amount :</b> ${total}
				</div>
		
			</div>
		
		</div>

        <h3 style="text-align:center;">EMI SCHEDULE</h3>

        <table>
            <tr>
                <th>EMI NO</th>
                <th>EMI DATE</th>
                <th>EMI AMOUNT</th>
                <th>OUTSTANDING</th>
            </tr>
    `;

    while (total > 0) {

        let payment = total < emi ? total : emi;
        total -= payment;

        let date = new Date(today.getFullYear(), today.getMonth() + month, emiDate);
        let dateStr = date.toLocaleDateString('en-GB').replace(/\//g,'-');

        html += `
        <tr>
            <td>${month}</td>
            <td>${dateStr}</td>
            <td>${payment}</td>
            <td>${total.toFixed(2)}</td>
        </tr>
        `;

        month++;
    }

    html += `
        </table>

        <div style="margin-top:60px; display:flex; justify-content:flex-end;">
            <div style="text-align:center;">
                <div style="border-top:1px solid #000; width:180px;"></div>
                <div><b>Authorized Signature</b></div>
                <div>(Stamp)</div>
            </div>
        </div>

    </div>
    `;

    document.getElementById("schedule").innerHTML = html;
    document.getElementById("schedule").classList.remove("hidden");
    document.getElementById("downloadBtn").classList.remove("hidden");
}

// Download PDF
function downloadPDF() {

    let element = document.getElementById("pdfContent");

    let fileName = `${currentRecord.AccountID}_${currentRecord.ClientName}.pdf`;

    let opt = {
        margin:[10,8,15,8],
        filename:fileName,
        html2canvas:{scale:1.6, scrollY:0, useCORS:true},
        jsPDF:{unit:'mm',format:'a4'},
        pagebreak:{mode:['css','legacy']}
    };

    html2pdf().set(opt).from(element).save();
}

// Refresh
function refreshPage() {

    document.getElementById("accId").value = "";
    document.getElementById("emiAmount").value = "";
    document.getElementById("emiDate").value = "";

    document.getElementById("result").innerHTML = "";
    document.getElementById("schedule").innerHTML = "";

    document.getElementById("result").classList.add("hidden");
    document.getElementById("schedule").classList.add("hidden");
    document.getElementById("emiSection").classList.add("hidden");
    document.getElementById("downloadBtn").classList.add("hidden");

    currentRecord = null;
}

</script>

</body>
</html>
