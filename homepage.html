<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Lookup</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(120deg,#89f7fe,#66a6ff);
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card {
    width:400px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input, button {
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    font-size:16px;
}

button {
    border:none;
    background:#4facfe;
    color:white;
    cursor:pointer;
}

.hidden { display:none; }

.result {
    margin-top:10px;
    padding:10px;
    background:#f4f6f8;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
    <h2>🔍 Account Lookup</h2>

    <!--<input type="text" id="accId" placeholder="Enter Account ID">-->
    <input type="text" id="accId" placeholder="Enter Account ID" oninput="searchData()">
    <!--<button onclick="searchData()">Search</button>-->

    <div id="status"></div>
    <div id="result" class="result hidden"></div>
</div>

<script>

let excelData = [];
let dataMap = {}; // 🔥 create once

// 🚀 Load JSON
window.onload = function () {

    document.getElementById("status").innerText = "Loading data...";

    fetch('data.json')
    .then(res => res.json())
    .then(data => {
        excelData = data;

        // 🔥 Build map once (FAST)
        data.forEach(row => {
            dataMap[String(row.AccountID).trim()] = row;
        });

        document.getElementById("status").innerText = "Data Loaded ✅";
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error loading data ❌";
        console.error(err);
    });
};


// 🔍 Search (FAST)
function searchData() {

    const id = document.getElementById("accId").value.trim();
    const resultDiv = document.getElementById("result");

    if (!id) {
        resultDiv.classList.remove("hidden");
        resultDiv.innerHTML = "Enter Account ID";
        return;
    }

    const record = dataMap[id]; // ⚡ instant lookup

    if (record) {
        resultDiv.classList.remove("hidden");
        resultDiv.innerHTML = `
            <p><b>Branch Name:</b> ${record.BranchName || ''}</p>
            <p><b>Name:</b> ${record.ClientName || ''}</p>
            <p><b>Client ID:</b> ${record.ClientID || ''}</p>
            <p><b>Address:</b> ${record.Address1 || ''}</p>
            <p><b>WrittenOff Date:</b> ${record.WrittenOffDate || ''}</p>
            <p><b>WrittenOff Amount:</b> ${record.WrittenOffAmount || ''}</p>
        `;
    } else {
        resultDiv.classList.remove("hidden");
        resultDiv.innerHTML = "No data found";
    }
}

</script>

</body>
</html>
